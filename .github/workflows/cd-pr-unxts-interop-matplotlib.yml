name: CD PR - unxts-interop-matplotlib

on:
  pull_request:
    paths:
      - "packages/unxts.interop.matplotlib/**"
      - ".github/workflows/cd-unxts-interop-matplotlib.yml"
      - ".github/workflows/cd-pr-unxts-interop-matplotlib.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  build:
    name: Build & inspect package (PR)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Required for hatch-vcs to determine version from git tags.
          # Can be removed if switching to hardcoded versions.
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          path: packages/unxts.interop.matplotlib
          upload-name-suffix: -unxts-interop-matplotlib
          attest-build-provenance-github: false
