name: CI

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, Mondays at midnight UTC. This is the ecosystem check: the
    # per-package jobs below are gated off on ordinary PRs, so this run is what
    # exercises every sibling package against current upstream releases and
    # catches breakage that lands without any change to this repo.
    - cron: "0 0 * * 1"

concurrency:
  # Keyed on the event as well as the ref. A `schedule` run reports the default
  # branch as `github.ref`, which is the same value a `push` to main reports --
  # so without `event_name` the weekly ecosystem run and a Monday-morning push
  # to main would share a group and, with `cancel-in-progress`, cancel each
  # other. Including it keeps them independent while still collapsing repeated
  # pushes to the same branch or PR.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSIONS: '["3.12", "3.13", "3.14"]'
  # NB: the tests-unxt job's exclude list (lines 144-152) hardcodes these
  # versions; update it if this changes, or macOS/Windows will silently run the
  # full matrix (GitHub Actions does not warn when exclude entries go stale).
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ env.PYTHON_VERSIONS }}
      oldest-python: ${{ steps.versions.outputs.oldest }}
      newest-python: ${{ steps.versions.outputs.newest }}
    steps:
      - id: versions
        run: |
          versions='${{ env.PYTHON_VERSIONS }}'
          oldest=$(echo "$versions" | jq -r '.[0]')
          newest=$(echo "$versions" | jq -r '.[-1]')
          echo "oldest=$oldest" >> $GITHUB_OUTPUT
          echo "newest=$newest" >> $GITHUB_OUTPUT

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install
        run: uv sync --no-default-groups --group nox --group lint --locked

      - name: Lint
        run: uv run --frozen nox -s lint

  # Static type-checking (pyright, scoped to tests/typing -- the `Quantity(1,
  # "m")` constructor guard) is enforced by the `pyright (typing guard)`
  # pre-commit hook, which the `format` job runs in CI. It is deliberately not a
  # dedicated job -- that would just double-run the hook.

  # Smoke test
  #
  # Every package (unxt itself and each packages/* member) carries a
  # `tests/smoke/` folder of fast, broad checks -- package imports and
  # public-API re-exports -- alongside a `tests/unit/` folder for everything
  # else. This job runs only the former, gating the full multi-OS/multi-Python
  # matrix below. Catches "the whole workspace is broken" in well under a
  # minute, instead of waiting on the full matrix to find that out.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [setup, format]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install
        run: uv sync --no-default-groups --all-packages --group test --locked

      - name: Smoke test
        run: |
          # `packages/*/tests/smoke` picks up every workspace member
          # automatically -- a new package just needs to add the folder, no
          # workflow edit required.
          uv run --frozen pytest -x --benchmark-disable \
            tests/smoke packages/*/tests/smoke

  # Documentation build
  #
  # Nothing previously gated Sphinx output: there was no docs job here, and the
  # `docs` nox session builds with `--keep-going` and no `-W`, so it exits 0
  # whatever it reports. (`.readthedocs.yaml` does set `sphinx.fail_on_warning`,
  # but that key is ignored when `build.commands` is present -- and it is.) 43
  # broken cross-references had accumulated on main, invisible to readers: a
  # dropped MyST link still renders as styled text, just not clickable.
  #
  # This gates the category that means "navigation is broken" --
  # `myst.xref_missing` -- rather than `-W`, which would also fail on ~120
  # nitpicky `ref.*` warnings for unresolvable third-party type annotations.
  # Those are curated in `nitpick_ignore` in docs/conf.py; ratcheting them to
  # zero is worth doing, but blocking every PR on that first is not.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `rediraffecheckdiff` diffs the doc tree against `main`, so the base
          # branch has to be in the clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Pin to the version Read the Docs publishes on
          # (.readthedocs.yaml build.tools.python), so this job builds the docs
          # in the same environment they actually ship in -- rather than
          # whatever ubuntu-latest happens to provide.
          python-version: "3.12"

      - name: Install
        run: uv sync --no-default-groups --group nox --group docs --locked

      - name: Build docs
        run: |
          set -o pipefail
          uv run --frozen nox -s docs -- --output-dir=_build 2>&1 | tee docs-build.log

      - name: Fail on broken cross-references
        run: |
          if grep -qF 'myst.xref_missing' docs-build.log; then
            echo "::error::Broken cross-references in the docs:"
            grep -F 'myst.xref_missing' docs-build.log
            echo
            echo "A relative link written with a '.md' suffix resolves through the"
            echo "filesystem, which follows the docs/packages/* symlinks out of the"
            echo "Sphinx srcdir and silently drops the link. Write the target"
            echo "without the extension, e.g. '(../packages/x/index)'."
            exit 1
          fi
          echo "No broken cross-references."

      # Prose that points a reader at a file -- "the rules live in
      # `src/unxt/.../register_primitives.py`" -- is not a link, so nothing
      # validated it and three such paths had already gone stale.
      - name: Check cited repository paths exist
        run: uv run --frozen python scripts/check_doc_paths.py

      # 22 URLs are redirected by rediraffe. Without this, moving a page again
      # silently breaks every inbound link to its old address.
      - name: Check moved pages still have redirects
        run: |
          git fetch --no-tags --depth=1 origin main
          uv run --frozen sphinx-build -b rediraffecheckdiff docs docs/_build/redirects

      # External links rot without warning. Self-links to unxt.readthedocs.io
      # are ignored in conf.py: a page added by a PR does not exist on Read the
      # Docs until that PR merges.
      - name: Check external links
        run: |
          set -o pipefail
          uv run --frozen sphinx-build -b linkcheck docs docs/_build/linkcheck 2>&1 | tee linkcheck.log

  # Main package tests
  tests-unxt:
    name: unxt Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        # macOS runners bill at 10x the Linux rate and Windows at 2x
        # (https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/about-billing-for-github-actions).
        # All 3 Python versions are already fully exercised on Linux; running
        # them again on macOS/Windows is cross-OS coverage, not cross-version
        # coverage, so one version per non-Linux OS is enough to catch a
        # platform-specific break. Pin it to the newest version so it also
        # doubles as a "does the latest supported Python work on this OS"
        # check.
        exclude:
          - runs-on: macos-latest
            python-version: "3.12"
          - runs-on: macos-latest
            python-version: "3.13"
          - runs-on: windows-latest
            python-version: "3.12"
          - runs-on: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group nox --group test --locked --package unxt

      # Parallelization via pytest-xdist: -n logical and --dist=loadfile. The
      # --dist=loadfile strategy is required (not tuning): Sybil's doctest
      # regions within one document share a namespace and must run in order in a
      # single worker; the default --dist=load would shard them across workers
      # and break those tests. --benchmark-disable appears on only 4 jobs
      # (tests-unxt, test-oldest, test-newest, test-interoperability):
      # pytest-benchmark is not installed in per-package job environments, and on
      # these 4 the flag is required because pyproject.toml's filterwarnings =
      # ["error",...] turns benchmark's xdist-auto-disable warning into an
      # INTERNALERROR. Do not add this flag to other jobs without verifying.
      - name: Test package
        run: |
          uv run --frozen --package unxt nox -s "pytest(package='unxt')" -- --cov --cov-report=xml --cov-report=term --durations=20 --benchmark-disable -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxt-api package tests
  tests-unxt-api:
    name: unxt-api Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxt-api') ||
      startsWith(github.head_ref, 'unxt-api/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxt-api

      - name: Test package
        run: |
          uv run --frozen --package unxt-api pytest packages/unxt-api/tests --cov=packages/unxt-api/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxt-hypothesis package tests
  tests-unxt-hypothesis:
    name:
      unxt-hypothesis Python ${{ matrix.python-version }} on ${{ matrix.runs-on
      }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxt-hypothesis') ||
      startsWith(github.head_ref, 'unxt-hypothesis/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxt-hypothesis

      - name: Test package
        run: |
          uv run --frozen --package unxt-hypothesis pytest packages/unxt-hypothesis/tests --cov=packages/unxt-hypothesis/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-api package tests
  tests-unxts-api:
    name: unxts-api Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-api') ||
      startsWith(github.head_ref, 'unxts-api/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-api

      - name: Test package
        run: |
          uv run --frozen --package unxts-api pytest packages/unxts.api/src
          uv run --frozen --package unxts-api pytest packages/unxts.api/tests --cov=packages/unxts.api/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-hypothesis package tests
  tests-unxts-hypothesis:
    name:
      unxts-hypothesis Python ${{ matrix.python-version }} on ${{ matrix.runs-on
      }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-hypothesis') ||
      startsWith(github.head_ref, 'unxts-hypothesis/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-hypothesis

      - name: Test package
        run: |
          # src doctests: leaf dir `unxts/hypothesis` shadows the installed
          # `hypothesis`, so sybil mis-imports it. Run these via pytest's
          # namespace-aware --doctest-modules (doctest plugin re-enabled by
          # overriding addopts, which otherwise sets `-p no:doctest`).
          # These src invocations run serially (no xdist), by design -- not oversight.
          uv run --frozen --package unxts-hypothesis pytest packages/unxts.hypothesis/src --doctest-modules -o addopts="--import-mode=importlib" -o consider_namespace_packages=true -o doctest_optionflags="ELLIPSIS NORMALIZE_WHITESPACE"
          uv run --frozen --package unxts-hypothesis pytest packages/unxts.hypothesis/tests --cov=packages/unxts.hypothesis/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-interop-gala package tests
  tests-unxts-interop-gala:
    name:
      unxts-interop-gala Python ${{ matrix.python-version }} on ${{
      matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-interop-gala') ||
      startsWith(github.head_ref, 'unxts-interop-gala/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-interop-gala

      - name: Test package
        run: |
          # src doctests: leaf dir `unxts/interop/gala` shadows the installed
          # `gala`, so sybil mis-imports it; use namespace-aware --doctest-modules.
          uv run --frozen --package unxts-interop-gala pytest packages/unxts.interop.gala/src --doctest-modules -o addopts="--import-mode=importlib" -o consider_namespace_packages=true -o doctest_optionflags="ELLIPSIS NORMALIZE_WHITESPACE"
          uv run --frozen --package unxts-interop-gala pytest packages/unxts.interop.gala/tests --cov=packages/unxts.interop.gala/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-interop-matplotlib package tests
  tests-unxts-interop-matplotlib:
    name:
      unxts-interop-matplotlib Python ${{ matrix.python-version }} on ${{
      matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-interop-matplotlib') ||
      startsWith(github.head_ref, 'unxts-interop-matplotlib/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-interop-matplotlib

      - name: Test package
        run: |
          uv run --frozen --package unxts-interop-matplotlib pytest packages/unxts.interop.matplotlib/tests --cov=packages/unxts.interop.matplotlib/src --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-interop-xarray package tests
  tests-unxts-interop-xarray:
    name:
      unxts-interop-xarray Python ${{ matrix.python-version }} on ${{
      matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-interop-xarray') ||
      startsWith(github.head_ref, 'unxts-interop-xarray/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-interop-xarray

      - name: Test package
        run: |
          # src doctests: leaf dir `unxts/interop/xarray` shadows the installed
          # `xarray`, so sybil mis-imports it; use namespace-aware --doctest-modules.
          # Both invocations measure coverage (the second appends), so the
          # doctest-only lines are not reported as uncovered.
          uv run --frozen --package unxts-interop-xarray pytest packages/unxts.interop.xarray/src --doctest-modules -o addopts="--import-mode=importlib" -o consider_namespace_packages=true -o doctest_optionflags="ELLIPSIS NORMALIZE_WHITESPACE" --cov=packages/unxts.interop.xarray/src --cov-report=
          uv run --frozen --package unxts-interop-xarray pytest packages/unxts.interop.xarray/tests --cov=packages/unxts.interop.xarray/src --cov-append --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-parametric package tests
  #
  # NB: the label clause below is weaker than it looks. The `🧩 unxts-parametric`
  # label is applied by the `Auto-label PRs` workflow, which runs on
  # `workflow_run` *after* `Collect PR labels` completes, while CI evaluates
  # `github.event.pull_request.labels` from the original `pull_request` payload.
  # The label therefore lands too late to gate the run it would need to gate,
  # and CI does not trigger on `types: [labeled]` -- so in practice it only
  # takes effect on the *next* push to the PR. Coverage for core changes that
  # break this package comes from the push-to-main and weekly `schedule` runs.
  tests-unxts-parametric:
    name:
      unxts-parametric Python ${{ matrix.python-version }} on ${{ matrix.runs-on
      }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-parametric') ||
      startsWith(github.head_ref, 'unxts-parametric/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-parametric

      - name: Test package
        run: |
          # src doctests and tests are collected in separate invocations: the
          # namespace package's leaf dir is imported under one name for src and
          # another for tests, so co-collecting them double-imports the module.
          uv run --frozen --package unxts-parametric pytest packages/unxts.parametric/src --cov=packages/unxts.parametric/src --cov-report=
          uv run --frozen --package unxts-parametric pytest packages/unxts.parametric/tests --cov=packages/unxts.parametric/src --cov-append --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # unxts-linalg package tests
  tests-unxts-linalg:
    name:
      unxts-linalg Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, '🧩 unxts-linalg') ||
      startsWith(github.head_ref, 'unxts-linalg/')
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked --package unxts-linalg

      - name: Test package
        run: |
          # src doctests: sybil's leaf-based import at the namespace boundary
          # would double-import the module under a second name (see conftest.py
          # `_DOCTEST_MODULE_SRC`); run these via pytest's namespace-aware
          # --doctest-modules (doctest plugin re-enabled by overriding addopts,
          # which otherwise sets `-p no:doctest`). Both invocations measure
          # coverage (the second appends), so the doctest-only lines are not
          # reported as uncovered.
          uv run --frozen --package unxts-linalg pytest packages/unxts.linalg/src --doctest-modules -o addopts="--import-mode=importlib" -o consider_namespace_packages=true -o doctest_optionflags="ELLIPSIS NORMALIZE_WHITESPACE" --cov=packages/unxts.linalg/src --cov-report=
          uv run --frozen --package unxts-linalg pytest packages/unxts.linalg/tests --cov=packages/unxts.linalg/src --cov-append --cov-report=xml --cov-report=term -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-oldest:
    name: Check Oldest Dependencies
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    strategy:
      fail-fast: false
      matrix:
        # Wrap the scalar `oldest-python` (e.g. "3.12") in a single-element list:
        # a matrix axis must be a sequence, otherwise it never expands and the
        # job silently never runs (making the required `CI Pass` gate fail).
        # Quotes keep it a string so e.g. "3.10" isn't parsed as the float 3.1.
        python-version: ["${{ needs.setup.outputs.oldest-python }}"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test package
        run: |
          uv run --frozen --package unxt --extra all --group test-all --resolution lowest-direct pytest --cov --cov-report=xml --cov-report=term --durations=20 --mpl --benchmark-disable -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-newest:
    name: Newest supported deps
    runs-on: ubuntu-latest
    needs: [setup, format, smoke]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install the project
        run: uv sync --no-default-groups --extra all --group test-all --upgrade

      - name: Test package
        run: |
          uv run --no-sync pytest --benchmark-disable -n logical --dist=loadfile

  test-interoperability:
    name: Check Interoperability
    runs-on: ${{ matrix.runs-on }}
    needs: [setup, format, smoke]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test package
        run: |
          uv run --frozen --package unxt --extra all --group test-all pytest --cov --cov-report=xml --cov-report=term --durations=20 --mpl --benchmark-disable -n logical --dist=loadfile

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    needs: [setup, format]
    if:
      github.event_name == 'workflow_dispatch' || (github.event_name ==
      'pull_request' && contains(github.event.pull_request.labels.*.name, '⏱️
      Run benchmarks')) || (github.event_name == 'push' && github.ref ==
      'refs/heads/main')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Run benchmarks
        uses: CodSpeedHQ/action@a4a36bb07c0638b0b4ca52bf1f3dad1b4289e52f # v4.18.1
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: instrumentation
          run: uv run --group test pytest tests/benchmark --codspeed

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      [
        setup,
        format,
        smoke,
        docs,
        tests-unxt,
        tests-unxt-api,
        tests-unxt-hypothesis,
        tests-unxts-api,
        tests-unxts-hypothesis,
        tests-unxts-interop-gala,
        tests-unxts-interop-matplotlib,
        tests-unxts-interop-xarray,
        tests-unxts-parametric,
        tests-unxts-linalg,
        test-oldest,
        test-newest,
        test-interoperability,
      ]
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # These per-package jobs only run on push / schedule /
          # workflow_dispatch / a package label / `<pkg>/*` branches (see their
          # `if:`), so on a normal PR they are intentionally skipped. Allow the
          # skip instead of treating it as a failure. On the weekly `schedule`
          # run they all execute, so nothing here is permanently unchecked.
          allowed-skips:
            tests-unxt-api, tests-unxt-hypothesis, tests-unxts-api,
            tests-unxts-hypothesis, tests-unxts-interop-gala,
            tests-unxts-interop-matplotlib, tests-unxts-interop-xarray,
            tests-unxts-linalg, tests-unxts-parametric
