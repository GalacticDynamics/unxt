name: Create Package Tags

# When a shared vX.Y.0 tag is pushed, automatically create package-specific
# tags (unxt-vX.Y.0, unxt-api-vX.Y.0, unxts-linalg-vX.Y.0, ...).
#
# The package tags are pushed with a **GitHub App token**, not the default
# GITHUB_TOKEN. This matters for two reasons:
#   1. GITHUB_TOKEN is read-only in this repo, so it cannot push tags.
#   2. Tags pushed with GITHUB_TOKEN do not trigger further workflows; tags
#      pushed with an App token do. That is what lets each package tag start
#      its own `CD - <package>` workflow, so this job no longer has to dispatch
#      them by hand (and therefore no longer needs `actions: write`).
#
# Requires two repository secrets for a GitHub App installed on this repo with
# `contents: write`:
#   - RELEASE_APP_ID
#   - RELEASE_APP_PRIVATE_KEY

on:
  push:
    tags:
      - "v*" # Shared release tags (coordinator tags)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3

jobs:
  create-package-tags:
    name: Create package-specific tags
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs no write access: tag creation and the push below are
    # authenticated with the App token minted in the first step.
    permissions:
      contents: read

    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Persist the App token so the `git push` below is authenticated with
          # it (and therefore triggers the package CD workflows).
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate that this is a .0 release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Coordinator tags must be exactly vX.Y.0 (no suffixes like -rc1).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "ERROR: Coordinator tag must match pattern ^v[0-9]+\.[0-9]+\.0$ (e.g., v1.2.0)"
            echo "Invalid tag: $TAG"
            echo ""
            echo "Coordinator tags must be for .0 releases only (vX.Y.0)."
            echo "Pre-release tags (e.g., v1.2.0-rc1) are not supported."
            echo ""
            echo "For bug-fix releases (X.Y.Z where Z > 0) or pre-releases, push a"
            echo "package-specific tag directly (e.g., unxt-v${VERSION})."
            exit 1
          fi

          echo "✅ Valid coordinator tag: $TAG"

      - name: Create and push package-specific tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch existing tags so we can detect (and safely re-run) partial runs.
          git fetch --tags --force

          # The commit the coordinator tag points to (annotated or lightweight).
          COORDINATOR_SHA=$(git rev-list -n 1 "$TAG")
          echo "Coordinator tag $TAG points to commit: $COORDINATOR_SHA"

          PACKAGES=("unxt" "unxt-api" "unxt-hypothesis" "unxts-api" "unxts-hypothesis" "unxts-interop-gala" "unxts-interop-matplotlib" "unxts-interop-xarray" "unxts-parametric" "unxts-linalg")
          TAGS_TO_PUSH=()

          for PACKAGE in "${PACKAGES[@]}"; do
            PACKAGE_TAG="${PACKAGE}-v${VERSION}"

            if git rev-parse "$PACKAGE_TAG" >/dev/null 2>&1; then
              # Tag exists already: it must point at the coordinator's commit.
              EXISTING_SHA=$(git rev-list -n 1 "$PACKAGE_TAG")
              if [ "$EXISTING_SHA" = "$COORDINATOR_SHA" ]; then
                echo "✅ Tag $PACKAGE_TAG already exists and points to the correct commit ($EXISTING_SHA)"
              else
                echo "ERROR: Tag $PACKAGE_TAG already exists but points to the wrong commit"
                echo "  Expected (coordinator tag $TAG): $COORDINATOR_SHA"
                echo "  Actual   ($PACKAGE_TAG):         $EXISTING_SHA"
                echo ""
                echo "Delete and recreate the package tag at the coordinator commit:"
                echo "  git push origin :refs/tags/$PACKAGE_TAG"
                echo "  git tag -f $PACKAGE_TAG $COORDINATOR_SHA && git push --force origin $PACKAGE_TAG"
                exit 1
              fi
            else
              echo "📝 Creating tag $PACKAGE_TAG"
              git tag "$PACKAGE_TAG" "$COORDINATOR_SHA" -m "Release $PACKAGE ${VERSION} (auto-created from ${TAG})"
              TAGS_TO_PUSH+=("$PACKAGE_TAG")
            fi
          done

          if [ ${#TAGS_TO_PUSH[@]} -eq 0 ]; then
            echo "✅ All package tags already exist for version ${VERSION} (nothing to push)."
            exit 0
          fi

          echo "📤 Pushing ${#TAGS_TO_PUSH[@]} new tag(s): ${TAGS_TO_PUSH[*]}"
          git push origin "${TAGS_TO_PUSH[@]}"
          echo "✅ Package tags pushed; each package's CD workflow starts automatically."
