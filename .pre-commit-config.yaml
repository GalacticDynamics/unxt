default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2026.08.14
    hooks:
      - id: sp-repo-review

  # `graphify-out/graph.json` is the committed code graph: a few megabytes of
  # compact JSON on one line with no trailing newline. The three exclusions
  # below keep the generic hooks off it -- a size check would reject it, and a
  # formatter or `end-of-file-fixer` would rewrite it on every commit, fighting
  # the `graphify-update` hook below. See CONTRIBUTING.md.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        exclude: ^graphify-out/graph\.json$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^graphify-out/graph\.json$
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--pattern", "^versions/.*"]
        always_run: true
        # Restrict to pre-commit so a push (e.g. a release tag) isn't mistaken for a commit.
        stages: [pre-commit]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.3"
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter. `markdown` is here because ruff formats the Python
      # in fenced code blocks, which is what `blacken-docs` used to do.
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.10"
    hooks:
      - id: prettier
        types_or: [yaml, html, css, scss, javascript, json, markdown]
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["tomli"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      # - id: taplo-lint

  # Pyright, scoped to the `tests/typing` fixture (see [tool.pyright]). Runs via
  # `uv run` so it gets an env where `unxt` and its deps resolve -- a bare
  # pyright could not import the package. Guards the `Quantity(1, "m")`
  # constructor typing; runs when any Python / lock / config changes.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (typing guard)
        entry: uv run --frozen --group typecheck --extra all pyright
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

  # ty, scoped to the `tests/typing` fixture -- the same `Quantity(1, "m")`
  # constructor guard as pyright, under a second checker. Runs via `uv run` so
  # `unxt` and its deps resolve; runs when any Python / lock / config changes.
  - repo: local
    hooks:
      - id: ty
        name: ty (typing guard)
        entry: uv run --frozen --group typecheck --extra all ty check
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

  # mypy, scoped (via [tool.mypy] files) to the `tests/typing` fixture -- the
  # same `Quantity(1, "m")` constructor guard as pyright, under a second checker.
  # mypy sees the `unit` param as `Any`, so it gates the constructors' return
  # types + strict cleanliness, not the unit argument. Runs via `uv run` so
  # `unxt` and its deps resolve.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (typing guard)
        entry: uv run --frozen --group typecheck --extra all mypy
        language: system
        pass_filenames: false
        files: (\.py$|^pyproject\.toml$|^uv\.lock$)
        require_serial: true

  # Rebuilds the committed code graph (`graphify-out/graph.json`) so it stays in
  # step with the code. Local tree-sitter parsing: no model call, nothing leaves
  # the machine. Behaves like a formatter -- if the graph changed it rebuilds and
  # stops the commit, so `git add graphify-out/graph.json` and commit again.
  # Two flags are load-bearing:
  #
  # `always_run` -- without it prek passes no filenames on a commit that only
  # *deletes* files, reports "no files to check", and leaves the deleted code's
  # nodes in the graph.
  #
  # `--force` (a full re-scan, not an incremental one) -- an incremental rebuild
  # does not purge every node of a file that changed, so a chain of them drifts
  # from a rebuild done in a fresh clone: measured at 5 stale nodes and 877
  # nodes in a different community. The committed graph has to equal what
  # `graphify.yml` builds on a bare checkout, or the weekly drift job opens a
  # pull request every time it runs. Costs ~13s with a warm cache, against ~2s.
  #
  # `PYTHONHASHSEED=0` pins community numbering, which depends on hash ordering.
  #
  # The `additional_dependencies` pin below is the only graphify version in the
  # repo: `graphify.yml` greps it back out of this file. Keep it extras-free --
  # with `[leiden]`
  # installed, clustering uses Leiden instead of the networkx Louvain fallback
  # and renumbers every community, rewriting the whole graph.
  #
  # Escape: `SKIP=graphify-update git commit ...` to commit without rebuilding.
  - repo: local
    hooks:
      - id: graphify-update
        name: graphify update
        language: python
        additional_dependencies: ["graphifyy==0.9.119"]
        entry: env PYTHONHASHSEED=0 graphify update . --force
        pass_filenames: false
        always_run: true

  # - repo: https://github.com/abravalheri/validate-pyproject
  #   rev: v0.23
